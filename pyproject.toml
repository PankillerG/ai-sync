[project]
name = "ai-sync"
version = "0.2.0"
description = "Sync AI skills, agents, rules, and configs across providers"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0",
    "jinja2>=3.1.6",
]

[project.scripts]
ai-sync = "ai_sync.cli:main"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ai_sync = ["templates/**/*", "presets/**/*"]
